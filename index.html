    <meta
      name="description"
      content="头版智造局 — 上传一张照片，由 AI 生成三种报纸/海报头版方案，可拖拽微调并导出图片。"
    />
    <title>头版智造局 · FRONT PAGE LAB</title>
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      ;(function () {
        try {
          var query = new URLSearchParams(location.search).get('theme')
          var stored = localStorage.getItem('fpl.theme.v1')
          var theme = query === 'light' || query === 'dark' ? query : stored
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    />
